name: Sync Data from Google Sources

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

#~ needed so the workflow can push refreshed data back to the repo
permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Fetch and process data
        run: npm run sync-data
      
      #~ commit refreshed data back to main - the push auto-triggers the vercel deploy via git integration
      - name: Commit and push data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes - skipping commit & deploy"
          else
            git commit -m "chore(data): scheduled sync from google sources"
            git push
          fi
      
      #~ keepalive ping so the supabase free project never pauses frm 7 days of inactivity
      - name: Ping Supabase via deployed app
        if: vars.APP_URL != ''
        run: curl -sf "${{ vars.APP_URL }}/api/remarks?locationId=keepalive" > /dev/null || echo "keepalive ping failed (non-fatal)"
